server {
  listen       80;
  server_name  _;
  root   /usr/share/nginx/html;

  # Relative redirects so a mapped host port (e.g. :8081) is preserved — the
  # default absolute_redirect drops the port and breaks no-trailing-slash links.
  absolute_redirect off;

  # Hashed assets are immutable by construction — cache hard.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Serve Astro's directory-per-page output for a no-trailing-slash URL
  # DIRECTLY (…/components/button -> …/components/button/index.html), with no
  # redirect hop at all.
  # no-cache (NOT no-store): revalidate on every load. Without any
  # Cache-Control the browser caches HTML heuristically, and after a
  # rebuild renames the hashed CSS the stale HTML pins dead stylesheet
  # URLs until a hard refresh — the owner-reported half-styled page,
  # reproduced on localhost 2026-08-16 (the local leg of the same bug
  # fixed on Pages by the asset-carryover deploy step).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;
}
