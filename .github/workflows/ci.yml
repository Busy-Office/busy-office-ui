name: CI

on:
  push:
    branches: [main]
    # Narrative-only commits skip CI entirely. This repo records every loop
    # iteration, and 8 of the last 30 commits touched ONLY these paths — at
    # ~12 minutes a run that was ~96 CI-minutes per 30 commits spent proving
    # that a log entry does not break a stylesheet.
    #
    # The list is deliberately short. DESIGN.md, LOOPS.md, README.md and
    # CHANGELOG.md are READ BY GATE SCRIPTS (check:rtl reads DESIGN.md,
    # stamp-readme reads the READMEs), so a markdown edit can genuinely turn
    # CI red and none of those may be ignored.
    #
    # `.roundtable/**` IS SAFE TO IGNORE, and that is now checked rather than
    # assumed (roadmap 169.4). It was not safe when this comment last claimed
    # it: `check:repo` ran check-resume-charter.mjs, which opens
    # .roundtable/RESUME.md — so a commit touching only .roundtable/** could
    # break check:repo and never be built. The charter check moved onto the
    # loop's own path (record_iteration.py), where its input lives.
    #
    # check:ci-ignores could not see this. It skipped every entry containing
    # '*', and this is the only glob — the gate written to catch exactly this
    # was blind in the one slot that mattered. It now covers globs by directory
    # prefix, and derives WHICH SCRIPTS CI RUNS from this file rather than
    # scanning every script on disk. Verify with:
    #     npm run check:ci-ignores -w docs
    #
    # ROADMAP.md IS READ BY A GATE, and the route to that sentence is worth
    # keeping. The old comment here claimed two gate scripts read it and used
    # that to justify not ignoring it. Measured on 2026-08-25: zero did — four
    # mentioned it in a comment, and the only opener was
    # scripts/loops/generate_status.py, which never runs in CI. So it was added
    # to this list, worth ~10 skipped runs per 60 commits.
    #
    # Within the same session the roadmap was split into ROADMAP.md plus
    # ROADMAP-ARCHIVE.md, and check:slice-refs was written to stop the 116
    # citations pointing into the archive from rotting — a gate that READS
    # ROADMAP.md. check:ci-ignores failed immediately, which is precisely its
    # job: an ignored path had silently stopped being safe to ignore. The
    # saving is forfeited because a roadmap-only commit can now genuinely turn
    # CI red by deleting a cited slice.
    #
    # STATUS.md is read by nothing, and check:ci-ignores asserts that rather
    # than trusting this comment — which is the lesson, since this comment was
    # wrong for months.
    #
    # .roundtable/** IS NOW READ BY A CI SCRIPT, and this comment used to claim
    # otherwise (2026-08-28, roadmap 169.4). check-resume-charter.mjs opens
    # .roundtable/RESUME.md and .roundtable/ENVIRONMENT.md, and it runs inside
    # check:repo. check:ci-ignores did NOT catch it: line ~80 filters out any
    # entry containing '*', because a directory glob has no single file to
    # open — so of the two entries here it verifies STATUS.md and skips this
    # one. Measured, not reasoned: the gate's pass line reads "verified against
    # 124 script(s): STATUS.md", and feeding check-resume-charter.mjs to its own
    # readsFile() returns true for both names.
    #
    # The consequence, stated rather than glossed: a commit touching ONLY
    # .roundtable/** can break check:repo and will not be built, so the failure
    # surfaces on the next commit that is. The attribution harm is smaller than
    # the general case this comment warns about — the gate names the file and
    # the reason in its failure text — but the invariant is genuinely violated.
    # Whether to un-ignore .roundtable/** (~27% more full runs, the saving this
    # list exists for) or move the charter check out of check:repo is a
    # cost/benefit call for the owner, filed as roadmap 169.4 rather than
    # decided by the wake that caused it.
    paths-ignore:
      - '.roundtable/**'
      - 'STATUS.md'
  pull_request:
    paths-ignore:
      - '.roundtable/**'
      - 'STATUS.md'

# Pushing twice in a minute used to run the whole suite twice. The older run
# is superseded the moment the newer one starts, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Everything that does not need a browser. Cheap, so it fails fast and tells
  # you within a minute if the CSS itself is wrong.
  # ---------------------------------------------------------------------------
  core:
    name: Core build, lint, unit tests, container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Core build includes the named-@container check — a bare query fails here.
      - name: Build core (CSS dist + TS)
        run: npm run build -w @busy-office/ui
      - name: Stylelint (bo- naming conventions)
        run: npm run lint:css -w @busy-office/ui
      - name: Behavior tests (against compiled dist)
        run: npx vitest run --root packages/core
      # The container is the tool every change is VERIFIED in — the quality bar
      # says screenshot it at two widths in both themes before committing — and
      # nothing verified the container itself. It rotted twice: chromium missing
      # for check-boost (fixed 2026-08-17), then DESIGN.md missing from the build
      # context after 33.1 made it a build input. Both were invisible locally,
      # because a failed `podman build` leaves the PREVIOUS image in place and
      # `podman run` cheerfully serves it — a stale screenshot that looks green.
      # Builds the image only; publishing it is a separate question.
      - name: Docs container builds
        run: docker build -f apps/docs/Containerfile -t bo-docs .

  # ---------------------------------------------------------------------------
  # The browser gates, sharded. They were 11 serial steps totalling ~12 minutes
  # while each one spends most of its time walking the same 121 built pages.
  # Sharding does not make any single gate faster; it makes the WALL CLOCK the
  # slowest shard instead of the sum. Shards are balanced against measured
  # step times, and every shard pays the same ~50s to build core + docs first.
  #
  # fail-fast is off on purpose: one shard going red must not hide what the
  # others would have found, which is the whole reason these are separate
  # gates rather than one script.
  # ---------------------------------------------------------------------------
  docs-gates:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Documented behaviour must be true — prose that asserts runtime
          # behaviour is a hypothesis until something runs it (2026-08-17).
          # Pure Intl, milliseconds: the SG/TH strings printed on /concepts/i18n
          # and the ISO-vs-CLDR precision divergence it names are facts about
          # the platform, so an ICU upgrade can make the page wrong on its own.
          - name: Claims + formatting
            run: npm run check:claims -w docs && npm run check:formatting -w docs
          # check:layout EXEMPTS the scroll containers from its overflow rule —
          # correctly, they are meant to overflow — and until 2026-08-24 nothing
          # then asked whether they SCROLL. The framework's entire answer to a
          # wide table was asserted nowhere (owner ask, roadmap 133).
          - name: Scroll sweep
            run: npm run check:scroll -w docs
          # One concurrent sweep: narrow/zoom overflow AND the WCAG 1.4.12
          # spacing override. Merged from two serial sweeps that cost 345s.
          # Forced colors catches the half generation cannot: a rule whose
          # selector no longer matches anything after a rename or a split.
          - name: Layout + forced-colors
            run: npm run check:layout -w docs && npm run check:forced-colors -w docs
          # Was run by hand and had drifted red unnoticed: two docs pages had
          # authoring bugs (a demo <main> nested inside the page's own main, a
          # demo section that had lost its <h2>). An accessibility framework
          # cannot ship docs with landmark and heading-order violations.
          # SC 2.5.8 uses the REAL spec test (24px circle, spacing exception),
          # because conformance here rides on spacing rather than a size floor.
          # The token contrast gate is static analysis over OUR pairs; it passed
          # on the page where vendored Pagefind CSS rendered at 1.46:1 — this
          # measures rendered third-party UI, the only way to see it.
          - name: Axe + target size + search
            run: npm run test:axe -w docs && npm run check:target-size -w docs && npm run check:search -w docs
          # The i18n page claims long translations wrap rather than clip — run
          # that claim at compact density in a +35% pseudo-locale.
          # The reference app is what adopters copy and what four docs pages
          # cite as the working implementation, and nothing tested it until 26.1.
          # The ERP suite is the framework's gap-finding instrument: 28 screens
          # built ONLY from shipped CSS, with check-erp-suite enforcing that it
          # has none of its own. One script so CI and the loop run the identical
          # thing; its audit starts its own server, so it needs nothing set up.
          # check:quickstart is the adoption path executed rather than
          # documented: an empty directory, npm i of the LOCAL pack, the
          # documented imports, a real kit screen pasted in, and an assertion
          # that it RENDERS. An unstyled page still has every row and every
          # class, so it checks computed style, not structure (roadmap 147.3).
          # create-ui's freshness check runs HERE, beside check:quickstart, on
          # purpose: quickstart proves the scaffolder produces a running app,
          # but installs a local tarball with --no-save, so it never resolves
          # the pin the scaffold writes. The two are complementary, and neither
          # alone would have caught a stale one (roadmap 155).
          - name: Pseudo-locale + reference app + ERP suite + scaffold freshness
            run: npm run check:pseudo -w docs && npm run check:po-app -w docs && npm run suite && npm run check:quickstart -w docs && npm run check -w @busy-office/create-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build core (CSS dist + TS)
        run: npm run build -w @busy-office/ui
      # Every browser gate reads the BUILT dist, and it must be built at the
      # Pages base path: CI serves from /busy-office-ui, and a harness that
      # assumes base-less URLs 404s its assets — which fails open, passing a
      # sweep over CSS-less pages (2026-08-16, three red runs in a row).
      - name: Build docs gallery at the Pages base path (incl. dist link check)
        run: npm run build -w docs
        env:
          DOCS_BASE: /busy-office-ui
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
