name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Core build includes the named-@container check — a bare query fails here.
      - name: Build core (CSS dist + TS)
        run: npm run build -w @busy-office/ui
      - name: Stylelint (bo- naming conventions)
        run: npm run lint:css -w @busy-office/ui
      - name: Behavior tests (against compiled dist)
        run: npx vitest run --root packages/core
      - name: Build docs gallery at the Pages base path (incl. dist link check)
        run: npm run build -w docs
        env:
          DOCS_BASE: /busy-office-ui
      # AFTER the docs build — it sweeps the built dist. (Ordering bug on
      # first landing: placed before the build, so dist did not exist.)
      # Documented behaviour must be true — prose that asserts runtime
      # behaviour is a hypothesis until something runs it (2026-08-17).
      - name: Documented-claims check
        run: npm run check:claims -w docs
      # Pure Intl, milliseconds: the SG/TH strings printed on /concepts/i18n
      # and the ISO-vs-CLDR precision divergence it names are facts about the
      # platform, so an ICU upgrade can make the page wrong on its own.
      - name: Formatting claims (Intl / ISO-vs-CLDR)
        run: npm run check:formatting -w docs
      # The i18n page claims long translations wrap rather than clip —
      # run that claim at compact density in a +35% pseudo-locale.
      - name: Pseudo-locale expansion check
        run: npm run check:pseudo -w docs
      # One concurrent sweep: narrow/zoom overflow AND the WCAG 1.4.12
      # spacing override. Merged from two serial sweeps that cost 345s.
      - name: Layout sweep (overflow + WCAG 1.4.12 text spacing)
        run: npm run check:layout -w docs
      # Was run by hand and had drifted red unnoticed: two docs pages had
      # authoring bugs (a demo <main> nested inside the page's own main, a
      # demo section that had lost its <h2>). An accessibility framework
      # cannot ship docs with landmark and heading-order violations, so the
      # sweep is a gate now rather than a habit (2026-08-17).
      - name: Axe accessibility audit (81 pages x 2 widths)
        run: npm run test:axe -w docs
      # Windows High Contrast support is a documented promise and the
      # component list on /concepts/accessibility is generated from the CSS.
      # This catches the half generation cannot: a forced-colors rule whose
      # selector no longer matches anything (left behind by a rename or a
      # component split).
      - name: Forced-colors rules still live
        run: npm run check:forced-colors -w docs
      # SC 2.5.8 with the REAL spec test (24px circle, spacing exception),
      # because the framework's conformance rides on spacing rather than on
      # a size floor — the docs claimed a 24px floor and were wrong.
      - name: Target size (WCAG 2.5.8)
        run: npm run check:target-size -w docs
      # The reference app is what adopters copy and what four docs pages cite as
      # the working implementation, and nothing tested it until 26.1. Boots the
      # app on a free port; ~12s, no container needed.
      - name: Reference app smoke + axe
        run: npm run check:po-app -w docs
