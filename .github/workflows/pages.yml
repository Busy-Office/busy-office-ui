name: Deploy docs to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @busy-office/ui
      - name: Behavior tests gate the deploy
        run: npx vitest run --root packages/core
      - name: Build docs with Pages base path
        run: npm run build -w docs
        env:
          DOCS_BASE: /busy-office-ui
      # Versioned snapshots (Slice 20 item 3): committed under
      # apps/docs/versions/<ver>/ (built at release time with
      # DOCS_BASE=/busy-office-ui/v/<ver>, pagefind stripped), served at
      # /v/<ver>/ alongside the latest docs. The switcher in the docs
      # header reads apps/docs/versions.json.
      - name: Include versioned doc snapshots
        run: |
          if [ -d apps/docs/versions ]; then
            mkdir -p apps/docs/dist/v
            cp -R apps/docs/versions/. apps/docs/dist/v/
          fi
      # Hashed-asset carryover (owner-reported bug, 2026-08-16): Pages
      # serves HTML with cache-control: max-age=600, so a browser reuses
      # a page's HTML for up to 10 minutes — and every deploy RENAMES the
      # hashed /_astro files and deletes the old ones, so cached HTML
      # 404s its own CSS and renders half-styled until a refresh
      # (verified live: an hour-old hash returned 404 while the current
      # HTML referenced new names). Fix: each deploy also ships the
      # PREVIOUS deploy's /_astro generation (restore last run's cache,
      # union without overwriting, save only the fresh generation for the
      # next run) — cached HTML older than one deploy is already past
      # max-age and revalidates on its own.
      - name: Restore previous deploy's hashed assets
        uses: actions/cache/restore@v4
        with:
          path: prev-astro
          key: astro-assets-${{ github.run_id }}
          restore-keys: astro-assets-
      - name: Carry previous hashed assets forward one generation
        run: |
          # snapshot the FRESH generation before the union — the saved
          # cache must hold only this deploy's files, or generations
          # would accumulate without bound
          cp -R apps/docs/dist/_astro fresh-astro
          if [ -d prev-astro ]; then
            cp -Rn prev-astro/. apps/docs/dist/_astro/ || true
          fi
          rm -rf prev-astro
          mv fresh-astro prev-astro
      - name: Save this deploy's hashed assets for the next run
        uses: actions/cache/save@v4
        with:
          path: prev-astro
          key: astro-assets-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # The only moment "published == HEAD" is supposed to be true. It cannot
      # live in CI: during CI for commit X the site is still serving X-1 by
      # definition, so it would fail on every run. STALE reds this job;
      # UNREACHABLE does not — see check-published.mjs for why.
      - name: Published site is the site we just built
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node apps/docs/scripts/check-published.mjs
